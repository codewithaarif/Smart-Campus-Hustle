name: CI

on:
  push:
    branches: [main, security-and-stability-fixes]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check frontend
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build frontend
        run: npm run build
